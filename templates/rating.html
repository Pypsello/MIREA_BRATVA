{% extends "base.html" %}

{% block content %}
<div class="rating-container">
    <h1>Рейтинг пользователей</h1>
    
    <table class="rating-table">
        <thead>
            <tr>
                <th>Место</th>
                <th>Пользователь</th>
                <th>Монеты</th>
                <th>Карточки</th>
                <th>Общее богатство</th>
            </tr>
        </thead>
        <tbody>
            {% for user, wealth in users %}
            <tr {% if user.id == current_user.id %}class="current-user"{% endif %}>
                <td>{{ loop.index }}</td>
                <td>
                    <a href="{{ url_for('view_profile', user_id=user.id) }}">
                        {{ user.username }}
                    </a>
                </td>
                <td>{{ user.coins }}</td>
                <td>{{ user.cards|length }}</td>
                <td>{{ wealth }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
