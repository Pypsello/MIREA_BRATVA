{% extends "base.html" %}

{% block title %}Сброс пароля — MIREA_BRATVA{% endblock %}

{% block content %}
<div class="auth-form">
    <h2>Сброс пароля</h2>
    <p class="form-hint">Укажите имя пользователя, email и новый пароль.</p>

    <form method="POST">
        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="new_password">Новый пароль</label>
            <input type="password" id="new_password" name="new_password" minlength="4" required>
        </div>

        <div class="form-group">
            <label for="confirm_password">Повторите новый пароль</label>
            <input type="password" id="confirm_password" name="confirm_password" minlength="4" required>
        </div>

        <button type="submit" class="btn">Обновить пароль</button>
    </form>

    <p class="auth-link">
        Вспомнили пароль? <a href="{{ url_for('login') }}">Вернуться ко входу</a>
    </p>
</div>
{% endblock %}
