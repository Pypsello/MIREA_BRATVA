{% extends "base.html" %}

{% block content %}
<div class="quizzes-container">
    <h1>Доступные тесты</h1>
    
    <div class="quizzes-grid">
        {% for quiz in quizzes %}
        <div class="quiz-card">
            <h3>{{ quiz.title }}</h3>
            <p class="quiz-subject">{{ quiz.subject }}</p>
            <p class="quiz-reward">Награда: {{ quiz.reward_coins }} монет</p>
            <p class="quiz-passing">Проходной балл: {{ quiz.passing_score }}%</p>
            <a href="{{ url_for('take_quiz', quiz_id=quiz.id) }}" class="btn">Начать тест</a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
